$kind: http-request
name: GET /api/health
url: "{{baseUrl}}/api/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 200', () => pm.response.to.have.status(200));
      pm.test('Status ok', () => { const j = pm.response.json(); pm.expect(j.status).to.eql('ok'); });
    language: text/javascript
order: 1000
