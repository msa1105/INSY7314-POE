$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Test User",
      "email": "test@hustlehub.test",
      "password": "weak",
      "role": "client"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 422', () => pm.response.to.have.status(422));
      pm.test('Fields array present', () => pm.expect(pm.response.json()).to.have.property('fields'));
    language: text/javascript
order: 4000
