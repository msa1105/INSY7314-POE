$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "alice@hustlehub.test",
      "password": "WrongPassword9!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401', () => pm.response.to.have.status(401));
      pm.test('Generic error message', () => pm.expect(pm.response.json().error).to.eql('Invalid email or password.'));
    language: text/javascript
order: 7000
