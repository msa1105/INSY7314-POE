$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Alice Dlamini",
      "email": "alice@hustlehub.test",
      "password": "SecurePass1!",
      "role": "client"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 409', () => pm.response.to.have.status(409));
      pm.test('Has error field', () => pm.expect(pm.response.json()).to.have.property('error'));
    language: text/javascript
order: 3000
