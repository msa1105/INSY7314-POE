$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "ghost@hustlehub.test",
      "password": "DoesntMatter1!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status 401', () => pm.response.to.have.status(401));
      pm.test('Generic message (no user enumeration)', () => pm.expect(pm.response.json().error).to.eql('Invalid email or password.'));
    language: text/javascript
order: 8000
