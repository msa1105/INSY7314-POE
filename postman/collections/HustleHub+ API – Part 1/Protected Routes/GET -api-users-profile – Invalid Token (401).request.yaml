$kind: http-request
name: GET /api/users/profile – Invalid Token (401)
url: "{{baseUrl}}/api/users/profile"
method: GET
headers:
  Authorization: Bearer this.is.not.a.real.token
scripts:
  - type: afterResponse
    code: pm.test('Status 401', () => pm.response.to.have.status(401));
    language: text/javascript
order: 3000
